<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 462 148" width="462" height="148">
  <defs>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#2a9d8f"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a9d8f"/>
      <stop offset="100%" style="stop-color:#1a6b62"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3db8ae"/>
      <stop offset="100%" style="stop-color:#27867c"/>
    </linearGradient>
    <linearGradient id="ncGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3ecf8e"/>
      <stop offset="100%" style="stop-color:#2ab87a"/>
    </linearGradient>
  </defs>

  <!-- 3D Cube -->
  <!-- Top face -->
  <polygon points="74,18 110,36 74,54 38,36" fill="url(#cubeTop)"/>
  <!-- Left face -->
  <polygon points="38,36 74,54 74,110 38,92" fill="url(#cubeLeft)"/>
  <!-- Right face -->
  <polygon points="74,54 110,36 110,92 74,110" fill="url(#cubeRight)"/>

  <!-- NC text -->
  <text x="125" y="98" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" fill="url(#ncGrad)">NC</text>

  <!-- logística text -->
  <text x="232" y="98" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="400" fill="#1aafb0">logística</text>

  <!-- small dot on i in logística (decorative override) -->
</svg>
